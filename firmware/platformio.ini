; CYD 一体板邮件提醒固件
; 编译: ~/.platformio/penv/bin/pio run -d ~/esp32-cyd-mail/firmware
; 烧录: 用 esptool 直写（pio -t upload 会清理 .pio/build，见 README）
[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32@6.5.0
board = esp32dev                 ; ESP32-D0WD-V3, 4MB Flash, 无 PSRAM, CH340
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-10
upload_speed = 115200

build_flags =
    -I include
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
